name: Update thumbnails

on:
  schedule:
    - cron: "0 21 * * *"   # 06:00 JST
  push:
    branches: [main]       # also runs right after a channel is added or removed from the page
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # always the newest list, even when an earlier run is queued

      - name: Collect videos
        run: python3 scripts/fetch.py

      - name: Save data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/videos.json "$RUNNER_TEMP/videos.json"
          # videos.json is fully rebuilt each run, so put ours on top of whatever main has now
          for i in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp "$RUNNER_TEMP/videos.json" data/videos.json
            git add data/videos.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -q -m "データを更新"
            git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
